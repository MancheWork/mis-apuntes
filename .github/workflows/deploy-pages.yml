name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Quartz
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java (PlantUML)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Graphviz
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y graphviz
          fi

      - name: Cache PlantUML jar
        id: plantuml-cache
        uses: actions/cache@v5
        with:
          path: ~/.plantuml/plantuml.jar
          key: plantuml-v1.2026.8

      - name: Download PlantUML jar
        if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.plantuml"
          curl -fsSL -o "$HOME/.plantuml/plantuml.jar" https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml.jar

      - name: Render PlantUML diagrams
        run: pwsh -NoProfile -File scripts/render-plantuml.ps1 -ContentDir content -JarPath "$HOME/.plantuml/plantuml.jar" -Rewrite

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm install

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build -d content -v

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
